<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal QR Share</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-lg bg-slate-800 rounded-2xl border border-slate-700 p-6 space-y-5">
        <header class="text-center">
            <h1 class="text-2xl font-bold text-teal-400">⚡ Quick Share</h1>
            <p class="text-xs text-slate-400">QR Code stays active for 24 hours</p>
        </header>

        <!-- Upload View -->
        <div id="createView" class="space-y-4">
            <textarea id="textInput" rows="3" placeholder="Paste text or code snippet..."
                class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-teal-400"></textarea>

            <div onclick="document.getElementById('fileInput').click()"
                class="border-2 border-dashed border-slate-600 hover:border-teal-400 bg-slate-900/40 rounded-xl p-4 text-center cursor-pointer">
                <input type="file" id="fileInput" class="hidden" onchange="updateFileName(this.files[0])">
                <p id="fileLabel" class="text-xs text-slate-400">Click to attach .pdf, .docx, .pptx, .xlsx, or image</p>
            </div>

            <button onclick="createShare()" id="btn"
                class="w-full bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold py-2.5 rounded-xl transition">
                Generate 24h QR Code
            </button>

            <!-- QR Output -->
            <div id="qrPanel" class="hidden text-center space-y-3 pt-4 border-t border-slate-700">
                <input id="shareUrl" type="text" readonly class="w-full bg-slate-900 border border-slate-700 text-teal-300 text-xs p-2 rounded text-center">
                <div class="flex justify-center">
                    <div id="qrcode" class="p-3 bg-white rounded-xl shadow"></div>
                </div>
            </div>
        </div>

        <!-- Download View (when scanned on mobile) -->
        <div id="receiveView" class="hidden space-y-4 text-center">
            <div id="textBlock" class="hidden text-left bg-slate-900 p-4 rounded-xl border border-slate-700">
                <p id="textOutput" class="text-sm font-mono whitespace-pre-wrap break-words"></p>
            </div>
            <div id="fileBlock" class="hidden">
                <a id="downloadBtn" download class="inline-block bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold px-6 py-2.5 rounded-xl">
                    Download File
                </a>
            </div>
            <a href="/" class="text-xs text-teal-400 underline block pt-2">Share Something Else</a>
        </div>
    </div>

    <script>
        let attachedFile = null;
        function updateFileName(file) {
            if (file) {
                attachedFile = file;
                document.getElementById('fileLabel').innerHTML = `Attached: <strong class="text-teal-400">${file.name}</strong>`;
            }
        }

        async function createShare() {
            const text = document.getElementById('textInput').value;
            if (!text.trim() && !attachedFile) return alert("Please provide text or a file!");

            const fd = new FormData();
            if (text.trim()) fd.append('content', text);
            if (attachedFile) fd.append('file', attachedFile);

            const res = await fetch('/api/share', { method: 'POST', body: fd });
            const data = await res.json();

            if (data.shareUrl) {
                document.getElementById('shareUrl').value = data.shareUrl;
                document.getElementById('qrcode').innerHTML = "";
                new QRCode(document.getElementById("qrcode"), { text: data.shareUrl, width: 150, height: 150 });
                document.getElementById('qrPanel').classList.remove('hidden');
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const id = new URLSearchParams(window.location.search).get('id');
            if (id) {
                document.getElementById('createView').classList.add('hidden');
                document.getElementById('receiveView').classList.remove('hidden');

                const res = await fetch(`/api/share/${id}`);
                if (!res.ok) {
                    alert("This QR code has expired or does not exist.");
                    window.location.href = '/';
                    return;
                }
                const data = await res.json();
                if (data.content) {
                    document.getElementById('textBlock').classList.remove('hidden');
                    document.getElementById('textOutput').textContent = data.content;
                }
                if (data.fileUrl) {
                    document.getElementById('fileBlock').classList.remove('hidden');
                    const btn = document.getElementById('downloadBtn');
                    btn.href = data.fileUrl;
                    btn.download = data.fileName;
                    btn.textContent = `Download ${data.fileName}`;
                }
            }
        });
    </script>
</body>
</html>
