<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick-Share | 24-Hour Temporary Drop</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --accent: #ff7b72;
      --accent-hover: #f25c54;
      --text: #c9d1d9;
      --border: #30363d;
      --success: #238636;
      --success-hover: #2ea043;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    h1 {
      margin-top: 0;
      color: #f0f6fc;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      background: #e3b34133;
      color: #f2cc60;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid #e3b34166;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      font-size: 0.9rem;
    }
    input[type="file"], textarea {
      width: 100%;
      box-sizing: border-box;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem;
      color: var(--text);
      font-family: inherit;
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    button.btn-primary {
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.btn-primary:hover {
      background: var(--accent-hover);
    }
    #resultArea {
      margin-top: 1.5rem;
      text-align: center;
      display: none;
    }
    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 1rem auto;
    }
    #qrcode img, #qrcode canvas {
      border-radius: 8px;
      padding: 8px;
      background: #ffffff;
    }
    .url-preview {
      font-size: 0.8rem;
      color: #58a6ff;
      word-break: break-all;
      margin: 0.5rem 0 1rem 0;
      background: #0d1117;
      border: 1px solid var(--border);
      padding: 0.5rem;
      border-radius: 6px;
    }
    .btn-save {
      width: 100%;
      padding: 0.75rem;
      background: var(--success);
      color: #ffffff;
      border: 1px solid var(--success);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-save:hover {
      background: var(--success-hover);
      border-color: var(--success-hover);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Quick-Share <span class="badge">24h Auto-Expiry</span></h1>
    <p style="font-size: 0.85rem; color: #8b949e; margin-bottom: 1.5rem;">
      Upload a file or paste text to generate a temporary QR code and link.
    </p>

    <form id="shareForm">
      <div class="form-group">
        <label for="fileInput">Choose File (Optional)</label>
        <input type="file" id="fileInput" name="file" />
      </div>

      <div class="form-group">
        <label for="textInput">Or Paste Text / URL</label>
        <textarea id="textInput" name="content" placeholder="Paste links, messages, notes..."></textarea>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">Generate QR</button>
    </form>

    <div id="resultArea">
      <div id="qrcode"></div>
      <div class="url-preview" id="linkDisplay"></div>
      
      <button class="btn-save" id="downloadQrBtn" type="button">💾 Save QR Image</button>
    </div>
  </div>

  <script>
    const form = document.getElementById('shareForm');
    const resultArea = document.getElementById('resultArea');
    const qrcodeContainer = document.getElementById('qrcode');
    const linkDisplay = document.getElementById('linkDisplay');
    const submitBtn = document.getElementById('submitBtn');
    const downloadQrBtn = document.getElementById('downloadQrBtn');

    let currentShareUrl = '';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const file = document.getElementById('fileInput').files[0];
      const text = document.getElementById('textInput').value.trim();

      if (!file && !text) {
        alert('Please select a file or enter text.');
        return;
      }

      const formData = new FormData();
      if (file) formData.append('file', file);
      if (text) formData.append('content', text);

      submitBtn.innerText = 'Generating...';
      submitBtn.disabled = true;

      try {
        const response = await fetch('/api/share', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Upload failed');

        const rawUrl = data.shareUrl || data.url || data.downloadUrl || 
                       (data.id ? `/download/${data.id}` : null) || 
                       (data.fileId ? `/download/${data.fileId}` : null);

        currentShareUrl = rawUrl.startsWith('http') ? rawUrl : `${window.location.origin}${rawUrl}`;

        qrcodeContainer.innerHTML = '';
        new QRCode(qrcodeContainer, {
          text: currentShareUrl,
          width: 200,
          height: 200,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });

        linkDisplay.textContent = currentShareUrl;
        resultArea.style.display = 'block';

      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        submitBtn.innerText = 'Generate QR';
        submitBtn.disabled = false;
      }
    });

    // Helper: extract data URL of the rendered QR
    function getQrDataUrl() {
      const canvas = qrcodeContainer.querySelector('canvas');
      if (canvas) return canvas.toDataURL('image/png');

      const img = qrcodeContainer.querySelector('img');
      if (img && img.src && img.src.startsWith('data:image')) {
        return img.src;
      }
      return null;
    }

    // DOWNLOAD QR IMAGE
    downloadQrBtn.addEventListener('click', () => {
      const dataUrl = getQrDataUrl();
      if (!dataUrl) {
        alert('QR code is not ready yet.');
        return;
      }
      const a = document.createElement('a');
      a.download = 'quick-share-qr.png';
      a.href = dataUrl;
      a.click();
    });
  </script>
</body>
</html>
