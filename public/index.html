<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick-Share | 24-Hour Temporary Drop</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

  <main class="quickshare-card">
    <h1 class="quickshare-header-title">Quick-Share <span class="expiry-pill-badge">24h Auto-Expiry</span></h1>
    <p class="quickshare-subtitle">
      Upload a file or paste text to generate a temporary QR code and link.
    </p>

    <form id="shareForm">
      <div class="upload-input-group">
        <label for="fileInput" class="upload-field-label">Choose File (Optional)</label>
        <input type="file" id="fileInput" class="file-select-control" name="file" />
      </div>

      <div class="upload-input-group">
        <label for="textInput" class="upload-field-label">Or Paste Text / URL</label>
        <textarea id="textInput" class="text-input-control" name="content" placeholder="Paste links, messages, notes..."></textarea>
      </div>

      <button type="submit" id="submitBtn" class="generate-qr-btn">Generate QR</button>
    </form>

    <section id="resultArea" class="qr-output-section">
      <div id="qrcode" class="qr-code-graphic"></div>
      <div id="linkDisplay" class="generated-link-display-box"></div>
      
      <button type="button" id="downloadQrBtn" class="save-qr-image-btn">💾 Save QR Image</button>
    </section>
  </main>

  <script>
    const form = document.getElementById('shareForm');
    const resultArea = document.getElementById('resultArea');
    const qrcodeContainer = document.getElementById('qrcode');
    const linkDisplay = document.getElementById('linkDisplay');
    const submitBtn = document.getElementById('submitBtn');
    const downloadQrBtn = document.getElementById('downloadQrBtn');

    let currentShareUrl = '';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const file = document.getElementById('fileInput').files[0];
      const text = document.getElementById('textInput').value.trim();

      if (!file && !text) {
        alert('Please select a file or enter text.');
        return;
      }

      const formData = new FormData();
      if (file) formData.append('file', file);
      if (text) formData.append('content', text);

      submitBtn.innerText = 'Generating...';
      submitBtn.disabled = true;

      try {
        const response = await fetch('/api/share', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Upload failed');

        const rawUrl = data.shareUrl || data.url || data.downloadUrl || 
                       (data.id ? `/download/${data.id}` : null) || 
                       (data.fileId ? `/download/${data.fileId}` : null);

        currentShareUrl = rawUrl.startsWith('http') ? rawUrl : `${window.location.origin}${rawUrl}`;

        qrcodeContainer.innerHTML = '';
        new QRCode(qrcodeContainer, {
          text: currentShareUrl,
          width: 200,
          height: 200,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });

        linkDisplay.textContent = currentShareUrl;
        resultArea.style.display = 'block';

      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        submitBtn.innerText = 'Generate QR';
        submitBtn.disabled = false;
      }
    });

    function getQrDataUrl() {
      const canvas = qrcodeContainer.querySelector('canvas');
      if (canvas) return canvas.toDataURL('image/png');

      const img = qrcodeContainer.querySelector('img');
      if (img && img.src && img.src.startsWith('data:image')) {
        return img.src;
      }
      return null;
    }

    downloadQrBtn.addEventListener('click', () => {
      const dataUrl = getQrDataUrl();
      if (!dataUrl) {
        alert('QR code is not ready yet.');
        return;
      }
      const a = document.createElement('a');
      a.download = 'quick-share-qr.png';
      a.href = dataUrl;
      a.click();
    });
  </script>
</body>
</html>
