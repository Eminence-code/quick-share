<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick-Share | 24-Hour Temporary Drop</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --accent: #ff7b72;
      --accent-hover: #f25c54;
      --text: #c9d1d9;
      --border: #30363d;
      --success: #238636;
      --success-hover: #2ea043;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    h1 {
      margin-top: 0;
      color: #f0f6fc;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      background: #e3b34133;
      color: #f2cc60;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid #e3b34166;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      font-size: 0.9rem;
    }
    input[type="file"], textarea {
      width: 100%;
      box-sizing: border-box;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem;
      color: var(--text);
      font-family: inherit;
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    button.btn-primary {
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.btn-primary:hover {
      background: var(--accent-hover);
    }
    #resultArea {
      margin-top: 1.5rem;
      text-align: center;
      display: none;
    }
    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 1rem auto;
    }
    #qrcode img, #qrcode canvas {
      border-radius: 8px;
      padding: 8px;
      background: #ffffff;
    }
    .url-box {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem;
      font-size: 0.8rem;
      color: #58a6ff;
      word-break: break-all;
      margin-bottom: 1rem;
    }
    .action-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .btn-row {
      display: flex;
      gap: 0.5rem;
    }
    .btn-action {
      flex: 1;
      padding: 0.65rem 0.5rem;
      background: #21262d;
      color: #f0f6fc;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-action:hover {
      background: #30363d;
      border-color: #8b949e;
    }
    .btn-save {
      background: #238636;
      border-color: #238636;
    }
    .btn-save:hover {
      background: #2ea043;
      border-color: #2ea043;
    }
    .toast {
      font-size: 0.8rem;
      color: #7ee787;
      margin-top: 0.5rem;
      min-height: 1.2rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Quick-Share <span class="badge">24h Auto-Expiry</span></h1>
    <p style="font-size: 0.85rem; color: #8b949e; margin-bottom: 1.5rem;">
      Upload a file or paste text to generate a temporary QR code and link.
    </p>

    <form id="shareForm">
      <div class="form-group">
        <label for="fileInput">Choose File (Optional)</label>
        <input type="file" id="fileInput" name="file" />
      </div>

      <div class="form-group">
        <label for="textInput">Or Paste Text / URL</label>
        <textarea id="textInput" name="content" placeholder="Paste links, message, notes..."></textarea>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">Generate QR</button>
    </form>

    <div id="resultArea">
      <div id="qrcode"></div>
      <div class="url-box" id="linkDisplay"></div>

      <div class="action-group">
        <div class="btn-row">
          <button class="btn-action" id="shareUrlBtn" type="button">📤 Share URL</button>
          <button class="btn-action" id="copyUrlBtn" type="button">📋 Copy URL</button>
        </div>
        <div class="btn-row">
          <button class="btn-action" id="shareQrBtn" type="button">📤 Share QR</button>
          <button class="btn-action" id="copyQrBtn" type="button">📋 Copy QR</button>
        </div>
        <button class="btn-action btn-save" id="downloadQrBtn" type="button">💾 Save QR Image</button>
      </div>
      <div class="toast" id="statusMessage"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('shareForm');
    const resultArea = document.getElementById('resultArea');
    const qrcodeContainer = document.getElementById('qrcode');
    const linkDisplay = document.getElementById('linkDisplay');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');

    let currentShareUrl = '';

    function showStatus(text) {
      statusMessage.textContent = text;
      setTimeout(() => {
        if (statusMessage.textContent === text) statusMessage.textContent = '';
      }, 3000);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const file = document.getElementById('fileInput').files[0];
      const text = document.getElementById('textInput').value.trim();

      if (!file && !text) {
        alert('Please select a file or enter text.');
        return;
      }

      const formData = new FormData();
      if (file) formData.append('file', file);
      if (text) formData.append('content', text);

      submitBtn.innerText = 'Generating...';
      submitBtn.disabled = true;

      try {
        const response = await fetch('/api/share', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Upload failed');

        // Resolve link using all possible response field names
        const rawUrl = data.shareUrl || data.url || data.downloadUrl || (data.id ? `${window.location.origin}/download/${data.id}` : null) || (data.fileId ? `${window.location.origin}/download/${data.fileId}` : null);

        if (!rawUrl) {
          throw new Error('Server returned an unknown response format.');
        }

        // Ensure full URL
        currentShareUrl = rawUrl.startsWith('http') ? rawUrl : `${window.location.origin}${rawUrl}`;

        qrcodeContainer.innerHTML = '';
        new QRCode(qrcodeContainer, {
          text: currentShareUrl,
          width: 200,
          height: 200,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });

        linkDisplay.textContent = currentShareUrl;
        resultArea.style.display = 'block';
        showStatus('QR and link generated successfully!');

      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        submitBtn.innerText = 'Generate QR';
        submitBtn.disabled = false;
      }
    });

    // Helper: extract data URL of the rendered QR
    function getQrDataUrl() {
      const canvas = qrcodeContainer.querySelector('canvas');
      if (canvas) return canvas.toDataURL('image/png');

      const img = qrcodeContainer.querySelector('img');
      if (img && img.src && img.src.startsWith('data:image')) {
        return img.src;
      }
      return null;
    }

    // Helper: convert DataURL to Blob
    function dataUrlToBlob(dataurl) {
      const arr = dataurl.split(',');
      const mime = arr[0].match(/:(.*?);/)[1];
      const bstr = atob(arr[1]);
      let n = bstr.length;
      const u8arr = new Uint8Array(n);
      while (n--) {
        u8arr[n] = bstr.charCodeAt(n);
      }
      return new Blob([u8arr], { type: mime });
    }

    // SHARE URL
    document.getElementById('shareUrlBtn').addEventListener('click', async () => {
      if (!currentShareUrl) return;

      if (navigator.share) {
        try {
          await navigator.share({
            title: 'Quick-Share Link',
            text: 'Here is your 24-hour file drop link:',
            url: currentShareUrl
          });
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }

      // Fallback
      await navigator.clipboard.writeText(currentShareUrl);
      showStatus('✅ Link copied to clipboard!');
    });

    // COPY URL
    document.getElementById('copyUrlBtn').addEventListener('click', async () => {
      if (!currentShareUrl) return;
      try {
        await navigator.clipboard.writeText(currentShareUrl);
        showStatus('✅ Link copied to clipboard!');
      } catch (err) {
        prompt('Copy this link:', currentShareUrl);
      }
    });

    // SHARE QR
    document.getElementById('shareQrBtn').addEventListener('click', async () => {
      const dataUrl = getQrDataUrl();
      if (!dataUrl) {
        alert('QR code is still preparing, try again in a moment.');
        return;
      }

      const blob = dataUrlToBlob(dataUrl);
      const file = new File([blob], 'quick-share-qr.png', { type: 'image/png' });

      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: 'Quick-Share QR',
            text: 'Scan this code to download the shared file.'
          });
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }

      // Fallback: download the QR
      const a = document.createElement('a');
      a.download = 'quick-share-qr.png';
      a.href = dataUrl;
      a.click();
      showStatus('💾 Downloaded QR Image!');
    });

    // COPY QR
    document.getElementById('copyQrBtn').addEventListener('click', async () => {
      const dataUrl = getQrDataUrl();
      if (!dataUrl) {
        alert('QR code is not ready yet.');
        return;
      }

      const blob = dataUrlToBlob(dataUrl);
      try {
        await navigator.clipboard.write([
          new ClipboardItem({ 'image/png': blob })
        ]);
        showStatus('✅ QR Image copied to clipboard!');
      } catch (err) {
        // Fallback: download if browser restricts image copying
        const a = document.createElement('a');
        a.download = 'quick-share-qr.png';
        a.href = dataUrl;
        a.click();
        showStatus('💾 Browser blocked image copy; QR was downloaded instead!');
      }
    });

    // DOWNLOAD QR
    document.getElementById('downloadQrBtn').addEventListener('click', () => {
      const dataUrl = getQrDataUrl();
      if (!dataUrl) return;
      const a = document.createElement('a');
      a.download = 'quick-share-qr.png';
      a.href = dataUrl;
      a.click();
      showStatus('💾 Downloaded QR Image!');
    });
  </script>
</body>
</html>
