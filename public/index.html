<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick-Share | 24-Hour Temporary Drop</title>
  <!-- Load QRCode library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --accent: #ff7b72;
      --accent-hover: #f25c54;
      --text: #c9d1d9;
      --border: #30363d;
      --success: #238636;
      --success-hover: #2ea043;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    h1 {
      margin-top: 0;
      color: #f0f6fc;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      background: #e3b34133;
      color: #f2cc60;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid #e3b34166;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      font-size: 0.9rem;
    }
    input[type="file"], textarea {
      width: 100%;
      box-sizing: border-box;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem;
      color: var(--text);
      font-family: inherit;
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    button.btn-primary {
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.btn-primary:hover {
      background: var(--accent-hover);
    }
    #resultArea {
      margin-top: 1.5rem;
      text-align: center;
      display: none;
    }
    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 1rem auto;
    }
    #qrcode img, #qrcode canvas {
      border-radius: 8px;
      padding: 8px;
      background: #ffffff;
    }
    .url-preview {
      font-size: 0.8rem;
      color: #8b949e;
      word-break: break-all;
      margin: 0.5rem 0 1rem 0;
    }
    .action-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .btn-row {
      display: flex;
      gap: 0.5rem;
    }
    .btn-action {
      flex: 1;
      padding: 0.65rem 0.5rem;
      background: #21262d;
      color: #f0f6fc;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-action:hover {
      background: #30363d;
      border-color: #8b949e;
    }
    .btn-save {
      background: #238636;
      border-color: #238636;
    }
    .btn-save:hover {
      background: #2ea043;
      border-color: #2ea043;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Quick-Share <span class="badge">24h Auto-Expiry</span></h1>
    <p style="font-size: 0.85rem; color: #8b949e; margin-bottom: 1.5rem;">
      Upload a file or write text to instantly generate a temporary share QR and link.
    </p>

    <form id="shareForm">
      <div class="form-group">
        <label for="fileInput">Choose File (Optional)</label>
        <input type="file" id="fileInput" name="file" />
      </div>

      <div class="form-group">
        <label for="textInput">Or Paste Text / URL</label>
        <textarea id="textInput" name="content" placeholder="Paste links, messages, or snippet code..."></textarea>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">Generate QR</button>
    </form>

    <div id="resultArea">
      <div id="qrcode"></div>
      <div class="url-preview" id="linkDisplay"></div>
      
      <div class="action-group">
        <div class="btn-row">
          <button class="btn-action" id="shareUrlBtn" type="button">📤 Share URL</button>
          <button class="btn-action" id="copyUrlBtn" type="button">📋 Copy URL</button>
        </div>
        <div class="btn-row">
          <button class="btn-action" id="shareQrBtn" type="button">📤 Share QR</button>
          <button class="btn-action" id="copyQrBtn" type="button">📋 Copy QR</button>
        </div>
        <button class="btn-action btn-save" id="downloadQrBtn" type="button">💾 Save QR Image</button>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('shareForm');
    const resultArea = document.getElementById('resultArea');
    const qrcodeContainer = document.getElementById('qrcode');
    const linkDisplay = document.getElementById('linkDisplay');
    const submitBtn = document.getElementById('submitBtn');

    let currentShareUrl = '';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const fileInput = document.getElementById('fileInput');
      const textInput = document.getElementById('textInput');
      const file = fileInput.files[0];
      const text = textInput.value.trim();

      if (!file && !text) {
        alert('Please choose a file or enter text to share.');
        return;
      }

      const formData = new FormData();
      if (file) formData.append('file', file);
      if (text) formData.append('content', text);

      submitBtn.innerText = 'Generating...';
      submitBtn.disabled = true;

      try {
        const response = await fetch('/api/share', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Server error uploading file.');

        currentShareUrl = data.shareUrl || `${window.location.origin}/view/${data.id}`;

        // Clear container and render QR reliably
        qrcodeContainer.innerHTML = '';
        new QRCode(qrcodeContainer, {
          text: currentShareUrl,
          width: 200,
          height: 200,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });

        linkDisplay.textContent = currentShareUrl;
        resultArea.style.display = 'block';

      } catch (err) {
        alert('Upload Error: ' + err.message);
      } finally {
        submitBtn.innerText = 'Generate QR';
        submitBtn.disabled = false;
      }
    });

    // Helper: extract canvas element safely
    function getQrCanvas() {
      const canvas = qrcodeContainer.querySelector('canvas');
      if (canvas) return canvas;

      const img = qrcodeContainer.querySelector('img');
      if (img && img.src) {
        const c = document.createElement('canvas');
        c.width = img.naturalWidth || 200;
        c.height = img.naturalHeight || 200;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0);
        return c;
      }
      return null;
    }

    // SHARE URL
    document.getElementById('shareUrlBtn').addEventListener('click', async () => {
      if (navigator.share) {
        try {
          await navigator.share({
            title: 'Quick-Share Drop',
            text: 'Here is your 24-hour quick-share URL:',
            url: currentShareUrl
          });
        } catch (err) {
          if (err.name !== 'AbortError') console.error(err);
        }
      } else {
        await navigator.clipboard.writeText(currentShareUrl);
        alert('Direct sharing unavailable. URL copied to clipboard!');
      }
    });

    // COPY URL
    document.getElementById('copyUrlBtn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(currentShareUrl);
        const btn = document.getElementById('copyUrlBtn');
        const orig = btn.innerText;
        btn.innerText = '✅ Copied URL!';
        setTimeout(() => btn.innerText = orig, 2000);
      } catch (err) {
        alert('Failed to copy URL.');
      }
    });

    // SHARE QR CODE
    document.getElementById('shareQrBtn').addEventListener('click', () => {
      const canvas = getQrCanvas();
      if (!canvas) {
        alert('QR code not ready yet.');
        return;
      }

      canvas.toBlob(async (blob) => {
        if (!blob) return;
        const file = new File([blob], 'quick-share-qr.png', { type: 'image/png' });

        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: 'Quick-Share QR Code',
              text: 'Scan this QR code to access the files.'
            });
          } catch (err) {
            if (err.name !== 'AbortError') console.error(err);
          }
        } else {
          alert('Sharing image files is unsupported on this browser. Use "Save QR Image" instead.');
        }
      }, 'image/png');
    });

    // COPY QR IMAGE
    document.getElementById('copyQrBtn').addEventListener('click', () => {
      const canvas = getQrCanvas();
      if (!canvas) {
        alert('QR code not ready yet.');
        return;
      }

      canvas.toBlob(async (blob) => {
        if (!blob) return;
        try {
          await navigator.clipboard.write([
            new ClipboardItem({ 'image/png': blob })
          ]);
          const btn = document.getElementById('copyQrBtn');
          const orig = btn.innerText;
          btn.innerText = '✅ Copied QR!';
          setTimeout(() => btn.innerText = orig, 2000);
        } catch (err) {
          alert('Direct image copy not supported in this browser. Please use "Save QR Image".');
        }
      }, 'image/png');
    });

    // SAVE QR IMAGE
    document.getElementById('downloadQrBtn').addEventListener('click', () => {
      const canvas = getQrCanvas();
      if (!canvas) return;
      const link = document.createElement('a');
      link.download = 'quick-share-qr.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
